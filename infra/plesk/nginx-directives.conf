# Plesk → Websites & Domains → konsepthane.net → "Apache & nginx Settings"
#   • Proxy mode: OFF (nginx serves the domain directly)
#   • Smart static files processing: OFF (otherwise Plesk serves /_next/static itself → 404)
#   • Additional nginx directives: paste everything below this comment block
# The project's own router listens on 127.0.0.1:8180 (NGINX_PORT in .env).

location / {
  proxy_pass http://127.0.0.1:8180;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 60s;
  proxy_buffering off;
  # Long CSP/Link headers from the app: raise the header buffer (default 4k → 502 "too big header").
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  client_max_body_size 16m;
}
