# Project router behind Plesk nginx (which owns 80/443 + TLS for konsepthane.net).
# Listens on plain HTTP; Plesk forwards Host / X-Forwarded-For / X-Forwarded-Proto.
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 16m;
  # Next.js responses carry a long Content-Security-Policy + Link/Set-Cookie headers; the 4k default
  # buffer made nginx answer 502 ("upstream sent too big header").
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  large_client_header_buffers 4 32k;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Scheme as seen by the visitor (Plesk sets X-Forwarded-Proto; default to https).
  map $http_x_forwarded_proto $client_scheme { default https; http http; https https; }
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # Resolve service names at request time (Docker's embedded DNS) instead of once at startup:
  # containers get new IPs on every `up -d --build`, and a static server list would keep the old
  # address → 502 until nginx restarts. Variables in proxy_pass force per-request resolution.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;
    server_name konsepthane.net www.konsepthane.net _;
    set $web   http://web:3000;
    set $admin http://admin:3001;
    set $api   http://api:4000;

    # www → apex (Plesk may already do this; harmless twice)
    if ($host = www.konsepthane.net) { return 301 https://konsepthane.net$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    # During a rolling deploy a name briefly resolves to a retiring container: try the next address.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 3s;

    # Backend API (browser calls https://konsepthane.net/api/v1/…)
    location /api/v1/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;
      proxy_set_header X-Request-ID $request_id;
    }
    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;
    }
    # Next.js route handlers of the web app: /api/session, /api/auth/google, /api/auth/google/callback
    location /api/ {
      proxy_pass $web;
    }
    location /api/auth/google/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass $web;
    }

    # Admin panel (basePath /admin)
    location /admin/ { proxy_pass $admin; }
    location = /admin { return 301 /admin/; }

    # Public site
    location / { proxy_pass $web; }

    # Long-lived static assets
    location ~* ^/(_next/static|placeholders|brand)/ {
      proxy_pass $web;
      # `add_header` in a location replaces the server-level set, so repeat the security headers.
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
  }
}
