# Project router behind Plesk nginx (which owns 80/443 + TLS for konsepthane.net).
# Listens on plain HTTP; Plesk forwards Host / X-Forwarded-For / X-Forwarded-Proto.
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 16m;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Scheme as seen by the visitor (Plesk sets X-Forwarded-Proto; default to https).
  map $http_x_forwarded_proto $client_scheme { default https; http http; https https; }
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  upstream web   { server web:3000; }
  upstream admin { server admin:3001; }
  upstream api   { server api:4000; }

  server {
    listen 80;
    server_name konsepthane.net www.konsepthane.net _;

    # www → apex (Plesk may already do this; harmless twice)
    if ($host = www.konsepthane.net) { return 301 https://konsepthane.net$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;

    # Backend API (browser calls https://konsepthane.net/api/v1/…)
    location /api/v1/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_set_header X-Request-ID $request_id;
    }
    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
    }
    # Next.js route handlers of the web app: /api/session, /api/auth/google, /api/auth/google/callback
    location /api/ {
      proxy_pass http://web;
    }
    location /api/auth/google/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://web;
    }

    # Admin panel (basePath /admin)
    location /admin/ { proxy_pass http://admin; }
    location = /admin { return 301 /admin/; }

    # Public site
    location / { proxy_pass http://web; }

    # Long-lived static assets
    location ~* ^/(_next/static|placeholders|brand)/ {
      proxy_pass http://web;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
  }
}
