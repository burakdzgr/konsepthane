# Production overlay — use together with the base file:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Deployment shape (Plesk host): Plesk's nginx owns 80/443 and TLS (Let's Encrypt) and proxies
# `konsepthane.net` to the project's own nginx on 127.0.0.1:${NGINX_PORT}. App containers and
# databases are never bound to the host (the router reaches them on the compose network), which
# also lets `infra/deploy/update.sh` run old and new copies side by side for zero-downtime deploys. Media lives in Cloudflare R2
# (public host media.konsepthane.net), e-mail goes out through Brevo SMTP — MinIO/Mailpit are
# dev-only here.
#
# NEXT_PUBLIC_* values are compiled into the Next.js bundles, so they are passed as build args
# (from .env) in addition to the runtime env_file.
x-build-args: &build-args
  WEB_URL: ${WEB_URL}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
  NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
  NEXT_PUBLIC_COOKIEBOT_ID: ${NEXT_PUBLIC_COOKIEBOT_ID:-}
  NEXT_PUBLIC_LEGAL_NAME: ${NEXT_PUBLIC_LEGAL_NAME:-konsepthane.net}
  NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-info@konsepthane.net}
  NEXT_PUBLIC_PRIVACY_EMAIL: ${NEXT_PUBLIC_PRIVACY_EMAIL:-info@konsepthane.net}
  NEXT_PUBLIC_CITY: ${NEXT_PUBLIC_CITY:-}
  NEXT_PUBLIC_SOCIAL_INSTAGRAM: ${NEXT_PUBLIC_SOCIAL_INSTAGRAM:-}
  NEXT_PUBLIC_SOCIAL_PINTEREST: ${NEXT_PUBLIC_SOCIAL_PINTEREST:-}
  NEXT_PUBLIC_SOCIAL_YOUTUBE: ${NEXT_PUBLIC_SOCIAL_YOUTUBE:-}
  NEXT_PUBLIC_SOCIAL_X: ${NEXT_PUBLIC_SOCIAL_X:-}
  NEXT_PUBLIC_SOCIAL_LINKEDIN: ${NEXT_PUBLIC_SOCIAL_LINKEDIN:-}

# The base file hard-codes local Docker endpoints (MinIO, Mailpit) in `environment:`, which would
# win over .env — production re-points them at the real services declared in .env.
x-prod-env: &prod-env
  NODE_ENV: production
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL}
  NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
  INTERNAL_MEDIA_URL: ${INTERNAL_MEDIA_URL:-}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MEILI_ENV: production
  # Mobile app deep links (/.well-known files are served only when these are set).
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}

services:
  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile, args: { APP: api, <<: *build-args } }
    # The base file runs dev servers; production must run the compiled apps.
    command: pnpm --filter @ilham/api start
    environment: *prod-env
    ports: !override [] # reached only through the router (no host port → rolling updates)
    restart: always
    depends_on: !override
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile, args: { APP: worker, <<: *build-args } }
    command: pnpm --filter @ilham/worker start
    environment: *prod-env
    ports: !override [] # reached only through the router (no host port → rolling updates)
    restart: always

  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile, args: { APP: web, <<: *build-args } }
    command: pnpm --filter @ilham/web start
    environment: *prod-env
    ports: !override [] # reached only through the router (no host port → rolling updates)
    restart: always

  admin:
    build: { context: ., dockerfile: infra/docker/Dockerfile, args: { APP: admin, <<: *build-args } }
    command: pnpm --filter @ilham/admin start
    environment: *prod-env
    ports: !override [] # reached only through the router (no host port → rolling updates)
    restart: always

  migrate:
    build: { context: ., dockerfile: infra/docker/Dockerfile, args: { APP: api, <<: *build-args } }
    environment: *prod-env
    command: sh -c "pnpm db:deploy"

  # Dev-only helpers are not started in production (R2 + Brevo replace them).
  mailpit:
    profiles: ['dev']
  minio:
    profiles: ['dev']
  minio-init:
    profiles: ['dev']

  postgres:
    ports: !override [] # never expose the database on the host
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    ports: !override []
    restart: always

  meilisearch:
    ports: !override []
    environment:
      MEILI_ENV: production
    restart: always

  # Project router (web / admin / api / static caching). Plain HTTP on localhost; Plesk nginx in
  # front terminates TLS and forwards Host + X-Forwarded-* headers.
  nginx:
    image: nginx:1.29-alpine
    ports: !override ['127.0.0.1:${NGINX_PORT:-8180}:80']
    # Mount the directory, not the file: `git pull` replaces files with new inodes and a
    # single-file bind mount keeps showing the old content (reload would re-apply stale config).
    volumes: !override
      - ./infra/nginx:/etc/nginx/konsepthane:ro
    command: ['nginx', '-c', '/etc/nginx/konsepthane/nginx.prod.conf', '-g', 'daemon off;']
    restart: always

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:17
    depends_on: { postgres: { condition: service_healthy } }
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ilham}
      POSTGRES_USER: ${POSTGRES_USER:-ilham}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: '-Z6 --schema=public --blobs'
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 8080
    networks: [backend]
    restart: always

volumes:
  postgres-data:
