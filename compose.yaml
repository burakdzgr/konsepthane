name: ilham

x-app: &app
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.dev
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-ilham}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-ilham}?schema=public
    REDIS_URL: redis://redis:6379
    MEILISEARCH_URL: http://meilisearch:7700
    S3_ENDPOINT: http://minio:9000
    INTERNAL_MEDIA_URL: http://minio:9000/${S3_BUCKET:-ilham-media}
    MEDIA_PUBLIC_URL: http://localhost:9000/${S3_BUCKET:-ilham-media}
    NEXT_PUBLIC_MEDIA_URL: http://localhost:9000/${S3_BUCKET:-ilham-media}
    SMTP_HOST: mailpit
    INTERNAL_API_URL: http://api:4000
  networks: [frontend, backend]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ilham}
      POSTGRES_USER: ${POSTGRES_USER:-ilham}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ilham} -d ${POSTGRES_DB:-ilham}'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes: [redis_data:/data]
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 20 }
    networks: [backend]
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.16
    environment:
      {
        MEILI_ENV: development,
        MEILI_MASTER_KEY: '${MEILISEARCH_MASTER_KEY:-change-me-minimum-16-characters}',
        MEILI_NO_ANALYTICS: 'true',
      }
    ports: ['7700:7700']
    volumes: [meili_data:/meili_data]
    healthcheck:
      {
        test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:7700/health'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    networks: [backend]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      {
        MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minioadmin}',
        MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-change-me-minio-secret}',
      }
    ports: ['9000:9000', '9001:9001']
    volumes: [minio_data:/data]
    healthcheck:
      {
        test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    networks: [backend]
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$S3_BUCKET && mc anonymous set download local/$$S3_BUCKET',
      ]
    environment:
      {
        MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minioadmin}',
        MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-change-me-minio-secret}',
        S3_BUCKET: '${S3_BUCKET:-ilham-media}',
      }
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
    healthcheck: { test: ['CMD', '/mailpit', 'readyz'], interval: 5s, timeout: 3s, retries: 20 }
    networks: [backend]
    restart: unless-stopped

  migrate:
    <<: *app
    # Sample-data seed (local development) only when SEED_SAMPLE_DATA=1 (never on a launch/production database).
    command: sh -c "pnpm db:generate && pnpm db:deploy && if [ \"$$SEED_SAMPLE_DATA\" = \"1\" ]; then pnpm db:seed; else echo 'seed skipped (SEED_SAMPLE_DATA!=1)'; fi"
    depends_on: { postgres: { condition: service_healthy } }
    restart: 'no'

  api:
    <<: *app
    command: pnpm --filter @ilham/api dev
    ports: ['${API_PORT:-4000}:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      {
        test:
          [
            'CMD',
            'node',
            '-e',
            "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
          ],
        interval: 10s,
        timeout: 5s,
        retries: 20,
      }

  worker:
    <<: *app
    command: pnpm --filter @ilham/worker dev
    ports: ['${WORKER_PORT:-4001}:4001']
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
        meilisearch: { condition: service_healthy },
      }
    healthcheck:
      {
        test:
          [
            'CMD',
            'node',
            '-e',
            "fetch('http://localhost:4001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
          ],
        interval: 10s,
        timeout: 5s,
        retries: 20,
      }

  web:
    <<: *app
    command: pnpm --filter @ilham/web dev
    ports: ['${WEB_PORT:-3000}:3000']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      {
        test:
          [
            'CMD',
            'node',
            '-e',
            "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
          ],
        interval: 10s,
        timeout: 5s,
        retries: 20,
      }

  admin:
    <<: *app
    command: pnpm --filter @ilham/admin dev
    ports: ['${ADMIN_PORT:-3001}:3001']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      {
        test:
          [
            'CMD',
            'node',
            '-e',
            "fetch('http://localhost:3001/admin/giris').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
          ],
        interval: 10s,
        timeout: 5s,
        retries: 20,
      }

  nginx:
    image: nginx:1.29-alpine
    ports: ['${NGINX_PORT:-8080}:80']
    volumes: ['./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on:
      {
        web: { condition: service_healthy },
        admin: { condition: service_healthy },
        api: { condition: service_healthy },
      }
    networks: [frontend]
    restart: unless-stopped

volumes: { postgres_data: {}, redis_data: {}, meili_data: {}, minio_data: {} }
networks: { frontend: {}, backend: {} }
